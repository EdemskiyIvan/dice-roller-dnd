<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0912" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Dice D&D" />
  <title>Кубы судьбы</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="loader" role="progressbar" aria-label="Загрузка" aria-valuemin="0" aria-valuemax="100">
    <div class="ld-wrap">
      <div class="ld-ring" id="ldRing"></div>
      <img class="ld-die" src="/dice/d20.png" alt="" draggable="false" />
    </div>
    <div class="ld-pct"><span id="ldPct">0</span><small>%</small></div>
    <div class="ld-text">Заряжаем кубы на удачу</div>
  </div>
  <div id="dice-box"></div>
  <div class="glow" id="glow"></div>

  <main class="stage" id="stage">
    <header class="top">
      <div class="die-name" id="dieName">d20</div>
      <div class="die-sub" id="dieSub">Нажми на кубик, чтобы бросить</div>
    </header>

    <section class="carousel" id="carousel" aria-label="Выбор кубика"></section>

    <div class="result" id="result" aria-live="polite">
      <div class="result-total" id="resultTotal"></div>
      <div class="result-parts" id="resultParts"></div>
    </div>

    <footer class="bottom">
      <div class="counter" role="group" aria-label="Количество кубиков">
        <button id="minus" aria-label="Меньше">−</button>
        <div class="count"><span id="count">1</span><small id="countLabel">кубик</small></div>
        <button id="plus" aria-label="Больше">+</button>
      </div>
    </footer>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
