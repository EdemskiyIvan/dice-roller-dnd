<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0912" />
  <title>Кубы судьбы</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="dice-box"></div>
  <div class="glow" id="glow"></div>

  <main class="stage" id="stage">
    <header class="top">
      <div class="die-name" id="dieName">d20</div>
      <div class="die-sub" id="dieSub">Нажми на кубик, чтобы бросить</div>
    </header>

    <section class="carousel" id="carousel" aria-label="Выбор кубика"></section>

    <div class="result" id="result" aria-live="polite">
      <div class="result-total" id="resultTotal"></div>
      <div class="result-parts" id="resultParts"></div>
    </div>

    <footer class="bottom">
      <div class="counter" role="group" aria-label="Количество кубиков">
        <button id="minus" aria-label="Меньше">−</button>
        <div class="count"><span id="count">1</span><small id="countLabel">кубик</small></div>
        <button id="plus" aria-label="Больше">+</button>
      </div>
    </footer>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
