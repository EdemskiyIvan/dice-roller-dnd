<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:transparent;overflow:hidden}
#dice-box{position:fixed;inset:0}#dice-box canvas{width:100%;height:100%;display:block}
</style></head><body><div id="dice-box"></div>
<script type="module">
import DiceBox from '@3d-dice/dice-box'
const box = new DiceBox({container:'#dice-box',assetPath:'/assets/dice-box/',theme:'default',themeColor:'#6d3df0',scale:22,
 gravity:2.4,restitution:.45,throwForce:5,spinForce:5,startingHeight:9,settleTimeout:5000,offscreen:true,lightIntensity:1.1,enableShadows:false})
let resolve
box.onRollComplete = g => resolve?.(g.flatMap(x=>x.rolls.map(r=>r.value))[0])
await box.init()
window.rollOnce = (sides) => new Promise(r => { resolve = r; box.clear(); box.roll('1d'+sides) })
window.ready = true
</script></body></html>
